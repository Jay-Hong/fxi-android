name: C02 Measurement

# S4 CUT-C02 (b′): the measurement job moved out of android.yml (ci_c02_workflow_split.r2) so that a failing measurement row
# no longer turns the build and acceptance workflow red. Same triggers as Android CI; its own concurrency group.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']

concurrency:
  group: c02-measurement-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # S4 CUT-C02 (b′) (cut_c02_bprime_agreed.r1.md, cut_c02_m1_agreed.r1.md): the cutover harness's measurement rows in their own
  # job. A row over the budget fails as it is and so does this job (no continue-on-error). This job must not be made a check a
  # merge requires; C02 is judged on its table and complete evidence, never on the workflow result. The checks, the table and the
  # upload each run on their own after any failure.
  c02-measurement:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - name: Set CI Kotlin daemon heap
        run: |
          mkdir -p "$HOME/.gradle"
          printf '%s\n' 'kotlin.daemon.jvmargs=-Xmx6g -Dfile.encoding=UTF-8' >> "$HOME/.gradle/gradle.properties"

      - name: Supply non-production google-services.json
        run: |
          mkdir -p app/src/debug app/src/ciMinified app/src/benchmark
          cp ci/google-services.ci-fixture.json app/src/debug/google-services.json
          cp ci/google-services.ci-fixture.json app/src/ciMinified/google-services.json
          cp ci/google-services.ci-fixture.json app/src/benchmark/google-services.json

      - name: C02 measurement
        id: measure
        run: ./gradlew :app:testC02Measurement

      - name: Verify the measurement case list
        if: always()
        run: |
          python3 tools/contracts/verify_cutover_acceptance.py \
            tools/contracts/c02_measurement_cases.json \
            app/build/test-results/c02Measurement

      - name: Measurement table
        if: always()
        run: |
          # The table's exit status (1 when not passed) must survive the tee: the default shell has no pipefail.
          set -o pipefail
          mkdir -p c02-table
          execution_sha="$(git rev-parse HEAD)"
          printf '%s\n' \
            "candidate_sha=${{ github.event.pull_request.head.sha || github.sha }}" \
            "execution_sha=$execution_sha" > c02-table/run-context.txt
          python3 tools/contracts/c02_measurement_table.py \
            tools/contracts/c02_measurement_cases.json \
            app/build/test-results/c02Measurement \
            --sha "$execution_sha" --run "${{ github.run_id }}/${{ github.run_attempt }}" \
            --status "${{ steps.measure.outcome }}" | tee c02-table/c02_measurement_table.md

      # Only this run's XML (the task always reruns), with the candidate SHA, run and measurement status in the table.
      - name: Upload measurement results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: c02-measurement-results
          path: |
            app/build/test-results/c02Measurement/
            app/build/reports/tests/c02Measurement/
            c02-table/
          retention-days: 14
