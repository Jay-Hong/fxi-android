name: Android CI

# S0 — 이 리포의 첫 CI. hosted ubuntu-24.04 에서 JDK 17 을 명시 pin 한다.
# tracked 파일에 host 절대경로(org.gradle.java.home 등)를 두지 않는 것이 전제이며,
# clean checkout 에서 project-local 경로 수정 없이 아래 lane 이 모두 돌아야 한다.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # The v6 line changes the default cache license/provider, while its MIT `basic`
      # provider is not cache-equivalent. Keep that migration separate from Node 24.
      - uses: gradle/actions/setup-gradle@v5

      # CI 전용 Kotlin 데몬 힙: 세 변형 시험 컴파일 태스크가 수 초 간격으로 로그에 기록된 뒤 4g 로 OOM 이 났고(2026-09-27
      # run 36304799327 attempt 1·2), compileBenchmarkUnitTestKotlin 출력 뒤 약 41분 무출력 상태에서 45분 job 제한에 도달한 시점에 취소된 적도 있다(제한에 따른 것으로 추정)
      # (36283759393 attempt 1, OOM 기록은 없음). 사용자 홈 설정이 저장소
      # gradle.properties 보다 우선하므로 로컬 개발 환경은 4g 그대로다. 첫 Gradle 실행 전에 둔다.
      - name: Set CI Kotlin daemon heap
        run: |
          mkdir -p "$HOME/.gradle"
          printf '%s\n' 'kotlin.daemon.jvmargs=-Xmx6g -Dfile.encoding=UTF-8' >> "$HOME/.gradle/gradle.properties"

      # 계획 S0 DoD: hosted runner가 실제로 사용하는 Gradle/JVM을 evidence에 남긴다.
      - name: Verify Gradle and JVM
        run: ./gradlew --version

      # production signing material 이 CI 에 새어 들어오지 않았음을, 그것을 쓸 수 있는
      # 어떤 lane 보다 앞서 증명한다. (.gitignore 로 제외돼 있지만 규칙이 바뀌면 조용히 유입될 수 있다.)
      # 위 --version 은 evidence 기록일 뿐 서명 산출물을 만들지 않는다.
      - name: Assert no production signing material
        run: |
          for f in fxi-release.jks local.properties; do
            if [ -e "$f" ]; then echo "::error::production 산출물이 CI checkout 에 존재: $f"; exit 1; fi
          done
          # Do not require -type f: a final-component symlink must be reported too.
          firebase_configs="$(find app -name google-services.json -print)"
          if [ -n "$firebase_configs" ]; then
            echo "::error::Firebase 설정이 fixture 공급 전에 CI checkout 에 존재"
            printf '%s\n' "$firebase_configs"
            exit 1
          fi

      # Exercise a low-level bundle producer directly. A missing Firebase config or signer
      # could also make this command fail, so require the D24 authorization failure itself
      # and prove that no AAB appeared.
      - name: Assert public release tasks are fail-closed
        run: |
          mkdir -p build/reports/s0g
          if find app/build/outputs/bundle/release -type f -name '*.aab' -print 2>/dev/null \
            | grep -q .; then
            echo "::error::clean checkout already contains a public AAB"
            exit 1
          fi
          set +e
          ./gradlew :app:packageReleaseBundle \
            -x :app:verifyPublicReleaseBuildApproved --console=plain \
            > build/reports/s0g/release-task-denial.txt 2>&1
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "::error::unapproved public release task succeeded"
            exit 1
          fi
          grep -Fq "Public release build is not approved" \
            build/reports/s0g/release-task-denial.txt
          if find app/build/outputs/bundle/release -type f -name '*.aab' -print 2>/dev/null \
            | grep -q .; then
            echo "::error::unapproved public AAB was produced"
            exit 1
          fi
          # Removal is a recovery action, not arming or artifact production.
          ./gradlew :app:uninstallRelease --dry-run --console=plain

      # Exercise the exact production Firebase owner checks without setting the public
      # arming/build approval property or producing a release artifact.
      - name: Assert production Firebase config is fail-closed
        run: |
          set -eu
          report=build/reports/s0g/production-firebase-denial.txt
          root=app/google-services.json
          shadow=app/src/release/google-services.json
          cleanup() {
            rm -f "$root" "$shadow"
            rmdir app/src/release 2>/dev/null || true
          }
          expect_denial() {
            expected="$1"
            set +e
            ./gradlew :app:verifyProductionGoogleServicesConfig --console=plain \
              > "$report" 2>&1
            rc=$?
            set -e
            if [ "$rc" -eq 0 ] || ! grep -Fq "$expected" "$report"; then
              cat "$report"
              echo "::error::production Firebase guard did not reject: $expected"
              exit 1
            fi
          }
          trap cleanup EXIT

          expect_denial "requires a regular, non-symlink app/google-services.json"

          ln -s ../ci/google-services.ci-fixture.json "$root"
          expect_denial "requires a regular, non-symlink app/google-services.json"
          rm -f "$root"

          cp ci/google-services.ci-fixture.json "$root"
          mkdir -p app/src/release
          cp ci/google-services.ci-fixture.json "$shadow"
          expect_denial "Firebase config is ambiguous"
          rm -f "$shadow"
          rmdir app/src/release

          expect_denial "must not reuse checked-in CI fixture identity fields"

          # Adding an inert field must not launder the same fake Firebase identity.
          awk 'NR == 1 { print; print "  \"ignored_by_google_services\": true,"; next } \
            { print }' ci/google-services.ci-fixture.json > "$root"
          expect_denial "must not reuse checked-in CI fixture identity fields"
          cleanup
          trap - EXIT

      # Firebase 설정은 비운영 fixture 로 공급한다. 실제 project 자격이 아니며
      # 컴파일·R8 검증에만 쓰인다(google-services 플러그인이 package_name 일치와
      # oauth_client type 3 → R.string.default_web_client_id 생성을 요구한다).
      # build-type 전용 경로만 사용하므로 release variant는 이 fixture를 볼 수 없다.
      - name: Supply non-production google-services.json
        run: |
          mkdir -p app/src/debug app/src/ciMinified app/src/benchmark
          cp ci/google-services.ci-fixture.json app/src/debug/google-services.json
          cp ci/google-services.ci-fixture.json app/src/ciMinified/google-services.json
          cp ci/google-services.ci-fixture.json app/src/benchmark/google-services.json

      # Pure-stdlib tests for the manual contract refresh tool. They do not
      # import the server or require the sibling Python repository.
      - name: Pure-stdlib utility tests
        run: |
          python3 -m unittest discover -s tools/contracts -p 'test_*.py'
          python3 -m unittest discover -s tools/release -p 'test_*.py'

      - name: Benchmark gate parser and evidence fixtures
        run: |
          python3 -m unittest discover -s tools/performance -p 'test_*.py'
          python3 tools/performance/benchmark_gate.py check-fixtures \
            tools/performance/fixtures/gate-cases.json

      # 세 변형을 한 호출에 두면 시험 컴파일 세 태스크가 수 초 간격으로 로그에 기록된다(동시 컴파일로 추정). 6g 로 올린 뒤에도 그 직후
      # 무출력으로 45분 job 제한 도달 시점에 취소된 기록이 두 번 더 있다(제한에 따른 취소로 추정)(37563185963·37569952754 각 attempt 1, OOM 기록은
      # 없음). 원인은 동시 컴파일의 메모리 압박으로 추정하며, 호출을 나눠 한 번에 한 변형만 컴파일한다.
      - name: Unit tests
        run: |
          ./gradlew testDebugUnitTest
          ./gradlew testCiMinifiedUnitTest
          ./gradlew testBenchmarkUnitTest

      - name: Lint
        run: ./gradlew lintDebug

      - name: Debug compile
        run: ./gradlew assembleDebug

      # 계획 S0 DoD 는 "기존 37 unit + 1 instrumented 테스트 무회귀" 를 요구한다.
      # 실행에는 기기/에뮬레이터가 필요하므로 hosted lane 은 **컴파일 회귀**까지 책임진다
      # (assembleDebug 는 androidTest 소스를 건드리지 않아 그대로 두면 조용히 썩는다).
      - name: Instrumented test compile (no device execution)
        run: ./gradlew assembleDebugAndroidTest

      # S0-f builds both sides of the physical-device lane on hosted Linux. Hosted CI does
      # not execute device tests; the local S0-f smoke enters only the benchmark no-data
      # Activity. MainActivity/Root functional journeys still wait for S0-g/S5 admission.
      - name: Macrobenchmark target and test APK compile (no device execution)
        run: ./gradlew :app:assembleBenchmark :macrobenchmark:assembleBenchmark

      # R8 lane 을 S11 로 미루지 않는 이유: kotlinx-serialization + R8 은
      # keep 규칙 누락으로 실제로 깨지는 조합이다(계획 §7 S0 각주).
      # ciMinified 는 release 를 상속해 동일 minify 규칙을 태우되 debug 서명을 쓴다.
      - name: R8 minified lane
        run: ./gradlew assembleCiMinified

      - name: Verify Macrobenchmark artifact wiring
        run: |
          mkdir -p build/reports/s0f
          ./gradlew :app:dependencyInsight \
            --configuration benchmarkRuntimeClasspath \
            --dependency androidx.profileinstaller:profileinstaller \
            --console=plain > build/reports/s0f/profileinstaller.txt
          python3 tools/performance/verify_benchmark_artifacts.py \
            --target-apk app/build/outputs/apk/benchmark/app-benchmark.apk \
            --test-apk macrobenchmark/build/outputs/apk/benchmark/macrobenchmark-benchmark.apk \
            --public-like-apk app/build/outputs/apk/ciMinified/app-ciMinified.apk \
            --dependency-report build/reports/s0f/profileinstaller.txt

      - name: Verify packaged D24 admission matrix
        run: |
          AAPT2="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 \
            -type f -name aapt2 -print | sort -V | tail -1)"
          test -x "$AAPT2"
          python3 tools/release/verify_release_admission_artifacts.py \
            --aapt2 "$AAPT2" \
            --artifact debug=off=app/build/outputs/apk/debug/app-debug.apk \
            --artifact ciMinified=on=app/build/outputs/apk/ciMinified/app-ciMinified.apk \
            --artifact benchmark=off=app/build/outputs/apk/benchmark/app-benchmark.apk

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: android-ci-reports
          path: |
            build/reports/
            app/build/reports/
            app/build/test-results/
          retention-days: 7

  # S4 CUT-C01·C02: the production-composition cutover acceptance on the real clock (many minutes), once per candidate in its
  # own job so the build job keeps its time. Required: a failed, skipped, missing, duplicated or unlisted case fails the job.
  cutover-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - name: Set CI Kotlin daemon heap
        run: |
          mkdir -p "$HOME/.gradle"
          printf '%s\n' 'kotlin.daemon.jvmargs=-Xmx6g -Dfile.encoding=UTF-8' >> "$HOME/.gradle/gradle.properties"

      - name: Supply non-production google-services.json
        run: |
          mkdir -p app/src/debug app/src/ciMinified app/src/benchmark
          cp ci/google-services.ci-fixture.json app/src/debug/google-services.json
          cp ci/google-services.ci-fixture.json app/src/ciMinified/google-services.json
          cp ci/google-services.ci-fixture.json app/src/benchmark/google-services.json

      - name: Cutover acceptance
        run: ./gradlew :app:testCutoverAcceptance

      - name: Verify the approved case list
        if: always()
        run: |
          python3 tools/contracts/verify_cutover_acceptance.py \
            tools/contracts/cutover_acceptance_cases.json \
            app/build/test-results/cutoverAcceptance

      # The physical send timelines and verdicts are evidence whether the run passed or failed.
      - name: Upload acceptance results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cutover-acceptance-results
          path: |
            app/build/test-results/cutoverAcceptance/
            app/build/reports/tests/cutoverAcceptance/
          retention-days: 14
